<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#72d6f3"><title>ビー玉コレクション</title><link rel="stylesheet" href="./style.css"></head><body>
<div id="app">
<section id="home" class="screen active"><div class="world"><div class="cloud cloud-a"></div><div class="cloud cloud-b"></div><div class="hill h1"></div><div class="hill h2"></div><main class="home-wrap"><p class="catch">やってみよう、つづけてみよう！</p><h1>ビー玉<br class="sp">コレクション</h1><div class="dashboard"><article class="counter card"><span>集めたビー玉</span><div><b id="count">0</b><strong> / <i id="goalLabel">100</i> 個</strong></div><div class="progress"><span id="progressBar"></span></div><p>あと <b id="remaining">100</b> 個で達成！</p></article><div class="jar-wrap"><div class="jar"><div class="rim"></div><div class="shine"></div><div id="jarMarbles" class="jar-marbles"></div></div></div></div><nav class="home-actions"><button class="primary" data-screen="tasks"><span>▣</span> やることをみる <b>›</b></button><button class="secondary" data-screen="settings"><span>⚙</span> 設定を変更する <b>›</b></button></nav><p class="note">コツコツつみかさねて、<br class="sp">自分だけのビー玉コレクションを完成させよう！</p></main><div class="table"></div></div></section>
<section id="tasks" class="screen page"><header><button class="back" data-screen="home">← ホーム</button><button class="add" id="openAdd">＋ 項目を追加</button></header><div class="page-title"><span>今日もコツコツ！</span><h2>やることリスト</h2><p>できた項目を押して、ビー玉を集めよう！</p></div><div id="taskList" class="task-list"></div></section>
<section id="settings" class="screen page"><header><button class="back" data-screen="home">← ホーム</button></header><div class="page-title"><span>自分用にカスタマイズ</span><h2>設定</h2><p>項目名、ビー玉の数、色を変更できます。</p></div><div id="settingsList" class="settings-list"></div><button class="add-row" id="addRow">＋ 新しい項目を追加</button><section class="goal-box"><label>目標のビー玉数<input id="goalInput" type="number" min="1" max="999"><small>個</small></label><p>おすすめは100個です</p></section><button class="save" id="saveSettings">設定を保存する</button></section>
<section id="complete" class="screen complete"><canvas id="confetti"></canvas><div class="complete-inner"><p class="yay">やったー！</p><h2><b id="completeNumber">100</b><span>個 達成！</span></h2><div class="trophy-jar"><div class="bow">🎀</div><div class="jar full"><div class="rim"></div><div class="full-balls">🔵 🟡 🟢 🔴<br>🟢 🔴 🔵 🟡<br>🟡 🔵 🟢 🔴</div></div></div><div class="award">よくがんばった！</div><p>小さな達成を積み重ねて、目標を達成できました！</p><button class="primary restart" id="restart">つぎのコレクションをはじめる ›</button></div></section>
</div>
<dialog id="taskDialog"><form id="taskForm"><h3>新しい項目</h3><label>やること<input id="newName" required maxlength="40" placeholder="例：宿題をする"></label><label>もらえるビー玉<input id="newPoints" required type="number" min="1" max="100" value="5"></label><label>ビー玉の色<select id="newColor"><option value="green">みどり</option><option value="blue">あお</option><option value="yellow">きいろ</option><option value="red">あか</option><option value="purple">むらさき</option></select></label><div><button type="button" class="back" id="cancelDialog">キャンセル</button><button class="save">追加する</button></div></form></dialog>
<div id="flyingMarble"></div><div id="toast"></div><script src="./app.js"></script></body></html>
